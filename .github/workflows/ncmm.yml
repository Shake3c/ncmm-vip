name: 网易云音乐人黑胶 VIP 自动化

on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）运行一次
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  ncmm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 配置
        uses: actions/checkout@v4

      - name: 准备工作目录
        run: mkdir -p data

      - name: 生成主账号 Cookie 文件
        env:
          MUSIC_U: ${{ secrets.MUSIC_U }}
          CSRF: ${{ secrets.__CSRF }}
        run: |
          python3 -c "
          import json, os
          cookies = [
            {'name': 'MUSIC_U', 'value': os.environ['MUSIC_U'], 'domain': 'music.163.com', 'path': '/'},
            {'name': '__csrf', 'value': os.environ['CSRF'], 'domain': 'music.163.com', 'path': '/'}
          ]
          with open('cookie_main.json', 'w') as f:
            json.dump(cookies, f)
          "

      - name: 导入主账号 Cookie
        run: |
          docker run --rm \
            -v "$PWD/data:/data" \
            -v "$PWD/cookie_main.json:/cookie_main.json" \
            ghcr.io/3899/ncmm:latest \
            login cookie -f /cookie_main.json --format json -m -o /data/cookie.json --home /data

      - name: 生成小号1 Cookie 文件
        env:
          MUSIC_U: ${{ secrets.MUSIC_U_FAN1 }}
          CSRF: ${{ secrets.__CSRF_FAN1 }}
        run: |
          python3 -c "
          import json, os
          cookies = [
            {'name': 'MUSIC_U', 'value': os.environ['MUSIC_U'], 'domain': 'music.163.com', 'path': '/'},
            {'name': '__csrf', 'value': os.environ['CSRF'], 'domain': 'music.163.com', 'path': '/'}
          ]
          with open('cookie_fan1.json', 'w') as f:
            json.dump(cookies, f)
          "

      - name: 导入小号1 Cookie
        run: |
          docker run --rm \
            -v "$PWD/data:/data" \
            -v "$PWD/cookie_fan1.json:/cookie_fan1.json" \
            ghcr.io/3899/ncmm:latest \
            login cookie -f /cookie_fan1.json --format json -o /data/fan1.json --home /data

      - name: 生成小号2 Cookie 文件
        env:
          MUSIC_U: ${{ secrets.MUSIC_U_FAN2 }}
          CSRF: ${{ secrets.__CSRF_FAN2 }}
        run: |
          python3 -c "
          import json, os
          cookies = [
            {'name': 'MUSIC_U', 'value': os.environ['MUSIC_U'], 'domain': 'music.163.com', 'path': '/'},
            {'name': '__csrf', 'value': os.environ['CSRF'], 'domain': 'music.163.com', 'path': '/'}
          ]
          with open('cookie_fan2.json', 'w') as f:
            json.dump(cookies, f)
          "

      - name: 导入小号2 Cookie
        run: |
          docker run --rm \
            -v "$PWD/data:/data" \
            -v "$PWD/cookie_fan2.json:/cookie_fan2.json" \
            ghcr.io/3899/ncmm:latest \
            login cookie -f /cookie_fan2.json --format json -o /data/fan2.json --home /data

      - name: 运行批量任务
        run: |
          docker run --rm \
            -v "$PWD/data:/data" \
            -v "$PWD/config.yaml:/config.yaml" \
            ghcr.io/3899/ncmm:latest \
            -c /config.yaml --home /data task
